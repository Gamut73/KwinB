name: Create . CLI executables
on: [push]
jobs:
  build-linux-executable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native image
        uses: ./.github/actions/build-native-image

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: .-linux
          path: .
      - name: Package as .deb
        run: |
          mkdir -p deb-pkg/usr/local/bin
          cp . deb-pkg/usr/local/bin/.          mkdir -p deb-pkg/DEBIAN
          cat <<EOF > deb-pkg/DEBIAN/control
          Package: .          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: twenty-eight the.28th.artificery@gmail.com
          Description: . CLI tool
          EOF
          dpkg-deb --build deb-pkg ..deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: .-linux-deb
          path: ..deb

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native image
        uses: ./.github/actions/build-native-image

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: .-macos
          path: .
      - name: Package as .dmg
        run: |
          mkdir -p dmg-staging
          cp . dmg-staging/.          hdiutil create \
            -volname "." \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            ..dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: .-macos-dmg
          path: ..dmg
